[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kel"
version = "0.1.0"
description = "Universal agentic OS: a normalized model gateway plus observability, budget, context/memory, retrieval, and runtime subsystems for building agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "venkatkk" }]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
cohere = ["cohere>=5.11"]
gemini = ["google-genai>=0.5"]
mistral = ["mistralai>=1.0"]
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]
s3 = ["boto3>=1.34"]
qdrant = ["qdrant-client>=1.10"]
pinecone = ["pinecone>=5.0"]
weaviate = ["weaviate-client>=4.6"]
chroma = ["chromadb>=0.5"]
pgvector = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
pdf = ["pypdf>=4.0"]
all = [
    "kel[anthropic,openai,cohere,gemini,mistral,otel,s3,qdrant,pinecone,weaviate,chroma,pgvector,pdf]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "qdrant-client>=1.10",
    "weaviate-client>=4.6",
]

[project.scripts]
kel = "kel.sdk.cli:run_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/kel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
